apiVersion: apps/v1
kind: Deployment
metadata:
  name: nginx
  labels:
    app: nginx
spec:
  replicas: 4
  selector:
    matchLabels:
      app: nginx
  template:
    metadata:
      labels:
        app: nginx
    spec:
      containers:
        - name: nginx
          image: crpi-vyt22uhlh2w61g5u.cn-shanghai.personal.cr.aliyuncs.com/nmgkds/myrepo:master-5604a6c
          ports:
            - containerPort: 80
